jobs:
  restore:
    uses: valkyrjaio/.github/.github/workflows/_restore-branch-from-backup.yml@f3b264c2ce852dda936b541d484e850dde9ba51a
    permissions:
      contents: write
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
