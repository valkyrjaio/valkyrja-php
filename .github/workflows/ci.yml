name: CI

on:
  push:
    branches: [ 'master', '*.x' ]

  pull_request:
    # A `branches` filter is deliberately absent. The filter matches the base branch, and a stacked
    # pull request bases on its parent's branch, so a filter of `master` and `*.x` gives that pull
    # request no gate until the parent merges. Every pull request runs the gate, whatever it targets.

    # `edited` is deliberately absent. It fires for a title or description edit, and this workflow
    # checks file content, which an edit cannot change. Running it on an edit would cost the full
    # tool suite for a typo. Guarding the jobs on `github.event.changes` instead does not work and
    # is not safe: a caller job skipped by `if:` never produces the `<job> / <job>` context the
    # required status checks wait for, so the pull request blocks; and a guard inside the job would
    # report success without running the tools, so an edit on a red pull request would turn it
    # green. Pull request metadata is checked by `pr.yml`, which does subscribe to `edited`.
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write
  contents: read

jobs:


  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@0a0630461a0edf067bc2cea2c71f837593d7f858
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  markdown-check:
    name: Markdown Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_markdown-check.yml@0a0630461a0edf067bc2cea2c71f837593d7f858
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  # PHP CS Fixer holds every PHP file to the copyright header, and it reads only PHP. A shell
  # script has no mechanism of its own for that reason. This job is closed by default instead: it
  # requires the header in every tracked file that `EXCLUDED` does not match, so a file of a type
  # no tool reads cannot pass in silence. `.github/ci/copyright-header/config` holds that list.
  # The job stands outside the `source-paths` filter that the `tools` job derives, because a
  # filter that misses a path skips the job, and a skipped job reads the same as a clean run.
  copyright-header-check:
    name: Copyright Header Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_copyright-header-check.yml@0a0630461a0edf067bc2cea2c71f837593d7f858
    permissions:
      pull-requests: write
      contents: read
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

  # A check's name is built from every job name down the call chain, so this composes
  # as `CI / Tools / <Tool> / …`.
  tools:
    name: Tools
    uses: valkyrjaio/.github/.github/workflows/_php-ci-tools.yml@0a0630461a0edf067bc2cea2c71f837593d7f858
    with:
      php-version: '8.4'
      additional-directory: '.github/ci/root-and-suggested'
      extensions: 'openswoole'
      composer-options: '--ignore-platform-req=ext-openswoole'
      php-versions: '["8.4", "8.5", "8.6"]'
      php-version-bleeding-edge: '8.6'
      phpunit-extensions: 'mbstring, intl, sodium, fileinfo, pdo, php-mysql, php-sqlite3, php-pgsql, pdo_sqlite, pdo_pgsql, pdo_mysql, openswoole, xdebug'
      psalm-run-script: 'psalm-shepherd-with-stats'
      source-paths: |
        bin/valkyrja
        functions/**/*.php
        src/**/*.php
        tests/**/*.php
        composer.json
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
