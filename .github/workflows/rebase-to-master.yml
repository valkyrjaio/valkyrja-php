name: Rebase to Master

on:
  workflow_dispatch:
    inputs:
      allow_diverged:
        description: 'Rebase even when master holds commits of its own'
        type: boolean
        default: false

run-name: "Rebase ${{ github.ref_name }} to master"

jobs:
  rebase:
    uses: valkyrjaio/.github/.github/workflows/_rebase-to-master.yml@9c7722c8846bb893d1acb6ed34e7ff48ff756f81
    permissions:
      contents: write
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      allow_diverged: ${{ inputs.allow_diverged }}
