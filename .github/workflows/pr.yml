name: PR

on:
  pull_request:
    # A `branches` filter is deliberately absent. The filter matches the base branch, and a stacked
    # pull request bases on its parent's branch, so a filter of `master` and `*.x` gives that pull
    # request no checks until the parent merges. Every pull request runs, whatever it targets.

    # `edited` fires for a title or description edit, and for a base-branch change — which is how
    # GitHub reports the auto-retarget a stacked pull request gets when its parent merges. Both are
    # pull request metadata, and this workflow checks pull request metadata, so both belong here.
    types: [ opened, synchronize, reopened, edited ]

permissions:
  pull-requests: write
  contents: read

jobs:

  commit-message-check:
    name: Commit Message Check
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@9c7722c8846bb893d1acb6ed34e7ff48ff756f81
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
