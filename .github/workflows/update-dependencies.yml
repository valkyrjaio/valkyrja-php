name: Update Dependencies

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-dependencies:
    uses: valkyrjaio/.github/.github/workflows/_php-update-dependencies.yml@0a0630461a0edf067bc2cea2c71f837593d7f858
    secrets:
      VALKYRJA_GHA_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
      VALKYRJA_GHA_PRIVATE_KEY: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
    with:
      php-version: '8.4'
      dependencies: |
        [
          {"name": "Root and Suggested Packages",  "command": "update",                              "directory": "."},
          {"name": "Root and Suggested CI",        "command": "root-and-suggested-composer-update",  "directory": ".github/ci/root-and-suggested"},
          {"name": "PHPArkitect",                  "command": "phparkitect-composer-update",         "directory": ".github/ci/phparkitect"},
          {"name": "PHPCodeSniffer",               "command": "phpcodesniffer-composer-update",      "directory": ".github/ci/phpcodesniffer"},
          {"name": "PHP-CS-Fixer",                 "command": "phpcsfixer-composer-update",          "directory": ".github/ci/phpcsfixer"},
          {"name": "PHPStan",                      "command": "phpstan-composer-update",             "directory": ".github/ci/phpstan"},
          {"name": "PHPUnit",                      "command": "phpunit-composer-update",             "directory": ".github/ci/phpunit"},
          {"name": "Psalm",                        "command": "psalm-composer-update",               "directory": ".github/ci/psalm"},
          {"name": "Rector",                       "command": "rector-composer-update",              "directory": ".github/ci/rector"},
          {"name": "Churn",                        "command": "churn-composer-update",               "directory": ".github/ci/churn"},
          {"name": "Infection",                    "command": "infection-composer-update",           "directory": ".github/ci/infection"},
          {"name": "PHPMD",                        "command": "phpmd-composer-update",               "directory": ".github/ci/phpmd"},
          {"name": "PHP Metrics",                  "command": "phpmetrics-composer-update",          "directory": ".github/ci/phpmetrics"}
        ]
